<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Sale | Shop</title>
    <link rel="stylesheet" href="./css/home.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="./js/home.js" defer></script>

</head>
<body>

    <header>
        <nav class="container">
            <div class="logo">GARAGE<span>SALE</span></div>
            <div class="nav-right">
                <div class="cart-trigger" id="cart-btn">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-count" id="cart-count">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="shop-header">
            <h1>The Collection</h1>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All Items</button>
                <button class="filter-btn" data-filter="clothes">Clothes</button>
                <button class="filter-btn" data-filter="electronics">Electronics</button>
            </div>
        </div>

        <div class="product-grid" id="main-grid">
            <div class="product-card" data-category="clothes">
                <div class="badge size-tag">Size: M</div>
                <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600" alt="Jacket" class="view-details">
                <div class="product-info">
                    <h3 class="view-details">Vintage Columbia Fleece</h3>
                    <p class="price">$55.00</p>
                    <button class="buy-btn" 
                        data-name="Columbia Fleece" 
                        data-price="55.00" 
                        data-category="clothes" 
                        data-size="Medium"
                        data-images="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600,https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?w=600"
                        data-desc="Classic 90s Columbia fleece. Perfect condition, extremely warm.">
                        Add to Cart
                    </button>
                </div>
            </div>

            <div class="product-card" data-category="electronics">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones" class="view-details">
                <div class="product-info">
                    <h3 class="view-details">Studio Headphones</h3>
                    <p class="price">$85.00</p>
                    <button class="buy-btn" 
                        data-name="Studio Headphones" 
                        data-price="85.00" 
                        data-category="electronics"
                        data-images="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600,https://images.unsplash.com/photo-1484704849700-f032a568e944?w=600"
                        data-desc="Professional headphones with high-fidelity audio. Barely used.">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div class="modal-body">
                <div class="modal-img-container" id="modal-img-container">
                    <img src="" id="modal-img-main">
                </div>
                <div class="modal-text">
                    <p class="modal-category" id="modal-cat"></p>
                    <h2 id="modal-title"></h2>
                    <div id="modal-size-box">Size: <span id="modal-size"></span></div>
                    <p class="modal-price" id="modal-price"></p>
                    <hr>
                    <p class="modal-desc" id="modal-desc"></p>
                    <button class="buy-btn modal-buy-trigger">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-overlay" id="overlay"></div>
    <aside class="cart-sidebar" id="sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" id="close-btn">&times;</button>
        </div>
        <div class="cart-items" id="cart-items-list"></div>
        
        <div class="cart-footer">
            <div class="total-row">
                <span>Total</span>
                <span id="cart-total">$0.00</span>
            </div>
            <button class="checkout-btn" id="buy-now-btn">Buy Now</button>
        </div>
    </aside>

</body>
</html>
